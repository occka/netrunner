[package]
name = "netrunner"
version = "0.6.0"
description = "NETRUNNER — industrial control environment for Windows"
edition = "2021"
rust-version = "1.80"

[lib]
name = "netrunner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: child webviews (BROWSER tabs inside NETRUNNER windows).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["time", "macros"] }
portable-pty = "0.9"
trash = "5"
# Local time for alarms (no timezone database: Windows provides the offset).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Alarm sounds: WASAPI output, MP3/WAV/OGG/FLAC decoding.
rodio = "0.20"
# Widget Studio feed widgets: RSS, Atom and JSON Feed.
feed-rs = "3"
# Brave's content-blocking engine (EasyList / uBlock syntax). Without the
# default `single-thread` feature the engine is Send + Sync.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

# NETRUNNER targets Windows only; these back the native integrations.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
keyring = { version = "3", features = ["windows-native"] }
# Same versions as Tauri's WebView2 backend (BROWSER hardening, media sessions).
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Audio decoding and mixing run in the sound device's callback. Unoptimized
# (plain `cargo build`) they cannot keep up and alarms crackle in dev builds.
[profile.dev.package.rodio]
opt-level = 3
[profile.dev.package.cpal]
opt-level = 3
[profile.dev.package.dasp_sample]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.claxon]
opt-level = 3
[profile.dev.package.lewton]
opt-level = 3
[profile.dev.package.hound]
opt-level = 3
